name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: 'ap-south-1'

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          echo "Testing AWS credentials..."
          aws sts get-caller-identity
          echo "✅ AWS credentials working"

      - name: Check if ECR repository exists
        run: |
          if aws ecr describe-repositories --repository-names ${{ secrets.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✅ ECR repository exists"
          else
            echo "⚠️ ECR repository doesn't exist, creating it..."
            aws ecr create-repository --repository-name ${{ secrets.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      - name: Verify ECR login
        run: |
          echo "ECR registry: ${{ secrets.ECR_REGISTRY }}"
          echo "ECR repository: ${{ secrets.ECR_REPOSITORY }}"
          # Test if Docker is authenticated to ECR
          docker system info | grep -i "Username" || echo "Checking Docker auth..."
          cat ~/.docker/config.json 2>/dev/null | grep -i "${{ secrets.ECR_REGISTRY }}" && echo "✅ ECR auth found in Docker config" || echo "⚠️ No ECR auth found"

      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "Building image: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG"
          docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker tag ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Docker image to ECR
        run: |
          echo "Pushing to ECR..."
          echo "Registry: ${{ secrets.ECR_REGISTRY }}"
          echo "Repository: ${{ secrets.ECR_REPOSITORY }}"
          
          # Manual ECR login as backup
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          
          # Push the images
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
          
          echo "✅ Push completed successfully"

      - name: Delete old images from ECR
        run: |
          echo "Fetching old images from ECR (excluding current build: ${{ env.IMAGE_TAG }})..."
          
          OLD_IMAGES=$(aws ecr list-images \
            --repository-name ${{ secrets.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --query "imageIds[?imageTag!='${{ env.IMAGE_TAG }}' && imageTag!='latest']" \
            --output json)
          
          COUNT=$(echo $OLD_IMAGES | jq '. | length' 2>/dev/null || echo "0")
          
          if [ "$COUNT" -gt "0" ]; then
            echo "Found $COUNT old image(s). Deleting..."
            aws ecr batch-delete-image \
              --repository-name ${{ secrets.ECR_REPOSITORY }} \
              --region ${{ env.AWS_REGION }} \
              --image-ids "$OLD_IMAGES" || echo "Failed to delete some images"
          else
            echo "No old images to delete."
          fi

      - name: Stop and remove existing container
        run: |
          docker stop ${{ secrets.CONTAINER_NAME }} 2>/dev/null || true
          docker rm ${{ secrets.CONTAINER_NAME }} 2>/dev/null || true

      - name: Pull latest image from ECR
        run: |
          docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Run new Docker container
        run: |
          docker run -d \
            --name ${{ secrets.CONTAINER_NAME }} \
            --restart unless-stopped \
            -p ${{ secrets.HOST_PORT }}:${{ secrets.CONTAINER_PORT }} \
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Verify container is running
        run: |
          sleep 5
          if docker ps | grep -q ${{ secrets.CONTAINER_NAME }}; then
            echo "✅ Container is running successfully"
            docker logs --tail 10 ${{ secrets.CONTAINER_NAME }}
          else
            echo "❌ Container failed to start!"
            docker logs ${{ secrets.CONTAINER_NAME }}
            exit 1
          fi