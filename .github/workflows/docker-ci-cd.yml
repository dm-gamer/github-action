name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

env:
  AWS_REGION: 'ap-south-1'
  ECR_REGISTRY: '611916855591.dkr.ecr.ap-south-1.amazonaws.com'
  # ❌ REMOVED: ECR_REPOSITORY and CONTAINER_NAME (these are now set dynamically)

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: self-hosted

    steps:
      - name: Pipeline Start
        run: |
          echo "==================================="
          echo "🚀 CI/CD Pipeline Started"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "==================================="

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Branch-Specific Variables
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "ENV_NAME=production"          >> $GITHUB_ENV
            echo "PORT=3000"                    >> $GITHUB_ENV
            echo "ECR_REPO=github-action"       >> $GITHUB_ENV
            echo "CONTAINER=github-action"      >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" == "dev" ]; then
            echo "ENV_NAME=development"         >> $GITHUB_ENV
            echo "PORT=3001"                    >> $GITHUB_ENV
            echo "ECR_REPO=github-action-dev"   >> $GITHUB_ENV
            echo "CONTAINER=github-action-dev"  >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          set -e

          IMAGE_TAG="${{ github.sha }}"
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}"

          echo "Building image for ${{ env.ENV_NAME }}..."
          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" .
          docker tag "${IMAGE_URI}:${IMAGE_TAG}" "${IMAGE_URI}:latest"

          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Deploy Container
        run: |
          set -e

          echo "CONTAINER : ${{ env.CONTAINER }}"
          echo "PORT      : ${{ env.PORT }}"
          echo "IMAGE_URI : ${{ env.IMAGE_URI }}"

          docker stop "${{ env.CONTAINER }}" || true
          docker rm "${{ env.CONTAINER }}" || true

          docker pull "${{ env.IMAGE_URI }}:latest"

          docker run -d \
            --name "${{ env.CONTAINER }}" \
            --restart unless-stopped \
            -p "${{ env.PORT }}:3000" \
            "${{ env.IMAGE_URI }}:latest"

      - name: Verify Container
        run: |
          set -e
          sleep 5
          if docker ps | grep -q "${{ env.CONTAINER }}"; then
            echo "✅ [${{ env.ENV_NAME }}] Container running"
            docker logs --tail 10 "${{ env.CONTAINER }}"
          else
            echo "❌ Container failed"
            docker logs "${{ env.CONTAINER }}" || true
            exit 1
          fi

      - name: Clean Old ECR Images
        run: |
          set -e
          OLD_IMAGES=$(aws ecr list-images \
            --repository-name "${{ env.ECR_REPO }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "imageIds[?imageTag!='${{ env.IMAGE_TAG }}' && imageTag!='latest']" \
            --output json)

          COUNT=$(echo "$OLD_IMAGES" | jq '. | length')
          if [ "$COUNT" -gt 0 ]; then
            aws ecr batch-delete-image \
              --repository-name "${{ env.ECR_REPO }}" \
              --region "${{ env.AWS_REGION }}" \
              --image-ids "$OLD_IMAGES" || true
          fi

      - name: Clean Local Docker Images
        run: docker image prune -f --filter "until=24h" || true

      - name: Success
        run: |
          echo "==================================="
          echo "🎉 [${{ env.ENV_NAME }}] Deployment Successful"
          echo "Branch : ${{ github.ref_name }}"
          echo "Image  : ${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}"
          echo "Port   : ${{ env.PORT }}"
          echo "==================================="